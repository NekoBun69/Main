<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Sementes de Paz</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>Sementes de Paz</h1>

        <button class="menu-toggle" aria-label="Abrir menu">
            ☰
        </button>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>

        <h2>Cadastro de Colaborador</h2>

        <form>
            <fieldset>

                <legend>Dados pessoais</legend>
                
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="data-nascimento">Data de nascimento:</label>
                <input type="date" id="data-nascimento" name="data-nascimento" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>

                <label for="Telefone">Telefone:</label>
                <input type="tel" id="Telefone" name="Telefone" placeholder="(00) 00000-0000" maxlength="15" pattern="\(\d{2}\) \d{5}-\d{4}" required>



            </fieldset>

            <fieldset>

                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    maxlength="9"
                    pattern="\d{5}-\d{3}"
                    required
                >

                <label for="endereco">Endereço:</label>
                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    required
                >

                <label for="cidade">Cidade:</label>
                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required
                >

                <label for="estado">Estado:</label>
                <input
                    type="text"
                    id="estado"
                    name="estado"
                    maxlength="2"
                    placeholder="SP"
                    required
                >

            </fieldset>

            <fieldset>
                <legend>Participação</legend>

                <p>Como você deseja participar?</p>

                <input
                    type="radio"
                    id="voluntario"
                    name="participacao"
                    value="voluntario"
                    required
                >
                <label for="voluntario">Quero atuar como voluntário</label>

                <input
                    type="radio"
                    id="doacao"
                    name="participacao"
                    value="doacao"
                >
                <label for="doacao">Quero contribuir com doações</label>

                <input
                    type="radio"
                    id="informacoes"
                    name="participacao"
                    value="informacoes"
                >
                <label for="informacoes">Quero receber informações sobre os projetos</label>

            </fieldset>

            <button type="submit">Enviar cadastro</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Sementes de Paz</p>
        <p>Contato: contato@exemplo.org</p>
    </footer>

</body>

</html>
